# OmniData Analytics & Sync Platform — local stack
#
#   cp .env.example .env      # then fill in every value
#   docker compose up --build
#
# UI:  http://localhost:8080      API docs: http://localhost:8000/docs
# All published ports are bound to 127.0.0.1 only.

name: omnidata

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in docker/.env (32+ chars)}
  DEMO_PASSWORD: ${DEMO_PASSWORD:?set DEMO_PASSWORD in docker/.env (12+ chars)}
  MSSQL_HOST: mssql
  MSSQL_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in docker/.env}
  POSTGRES_HOST: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
  MYSQL_HOST: mysql
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in docker/.env}
  CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: omnidata
      POSTGRES_USER: omnidata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../db/postgres:/docker-entrypoint-initdb.d:ro   # idempotent schema, runs on first start
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnidata -d omnidata"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: omnidata_auth
      MYSQL_USER: omnidata
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in docker/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in docker/.env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../db/mysql:/docker-entrypoint-initdb.d:ro      # 001..003 migrations, run on first start
    ports: ["127.0.0.1:3306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in docker/.env}
    volumes:
      - mssql_data:/var/opt/mssql
    ports: ["127.0.0.1:1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # One-shot job: SQL Server has no init directory, so apply the idempotent script explicitly.
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql: { condition: service_healthy }
    volumes:
      - ../db/mssql:/init:ro
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -C
      - -I
      - -b
      - -S
      - mssql
      - -U
      - sa
      - -P
      - ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in docker/.env}
      - -i
      - /init/001_source_and_sync.sql
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: omnidata/backend:dev
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      mysql: { condition: service_healthy }
      mssql-init: { condition: service_completed_successfully }
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Continuous queue consumer. Scale with: docker compose up --scale worker=3
  worker:
    image: omnidata/backend:dev
    command: ["python", "-m", "app.workers.ingest_worker"]
    environment: *backend-env
    depends_on:
      backend: { condition: service_healthy }

  # Node.js service: signed, idempotent webhook intake that writes to PostgreSQL.
  intake:
    build:
      context: ..
      dockerfile: docker/intake.Dockerfile
    image: omnidata/intake:dev
    environment:
      INTAKE_SIGNING_SECRET: ${INTAKE_SIGNING_SECRET:?set INTAKE_SIGNING_SECRET in docker/.env (32+ chars)}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    image: omnidata/frontend:dev
    depends_on:
      backend: { condition: service_healthy }
    ports: ["127.0.0.1:8080:80"]

volumes:
  pg_data:
  mysql_data:
  mssql_data:
